name: Build StealthGram (Telegram X) APK - 32 bit

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository with submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1
          lfs: true

      - name: Fetch LFS objects in submodules
        run: git submodule foreach --recursive 'git lfs pull || true'

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '25'

      - name: Setup Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Install Rust toolchain
        run: |
          RUST_VERSION=$(grep 'version.rust' version.properties | cut -d'=' -f2 | tr -d ' \r\n')
          if [ -z "$RUST_VERSION" ]; then RUST_VERSION="1.99.1"; fi
          echo "Installing Rust version: $RUST_VERSION"
          rustup toolchain install "$RUST_VERSION" --profile minimal --target aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android
          echo "RUST_HOME=$(rustup show home)" >> $GITHUB_ENV

      - name: Install Android SDK & NDK components
        run: |
          CMAKE_VER=$(grep 'version.cmake' version.properties | cut -d'=' -f2 | tr -d ' \r\n')
          if [ -z "$CMAKE_VER" ]; then CMAKE_VER="3.22.1"; fi
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install \
            "cmake;$CMAKE_VER" \
            "platforms;android-35" \
            "build-tools;35.0.0" || true

      - name: Configure local.properties
        run: |
          RUST_DIR=$(rustup show home)
          cat <<EOF > local.properties
          sdk.dir=$ANDROID_HOME
          rust.dir=$RUST_DIR
          app.id=org.stealthgram.messenger
          app.name=StealthGram
          telegram.api_id=25951885
          telegram.api_hash=389ff40efae9b1ad3e0b79d4ec864484
          app.disable_signing=true
          app.experimental=true
          tgx.extension=none
          app.download_url=https://telegram.org/dlx
          EOF

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build APK (armeabi-v7a, marshmallow)
        run: |
          touch /tmp/marker_v7a
          ./gradlew assembleMarshmallowDebug -Pandroid.injected.build.abi=armeabi-v7a -Dorg.gradle.jvmargs="-Xmx6g -XX:MaxMetaspaceSize=1g" --stacktrace

      - name: Collect and verify APK
        run: |
          mkdir -p apk-out
          find . -name "*.apk" -newer /tmp/marker_v7a -not -path "./apk-out/*" -exec cp -v {} apk-out/ \;
          ls -la apk-out
          APK=$(ls apk-out/*.apk | head -1)
          unzip -l "$APK" | grep -q "lib/armeabi-v7a/" || { echo "XATO: APK ichida armeabi-v7a kutubxonalari yo'q"; exit 1; }
          if unzip -l "$APK" | grep -q "lib/arm64-v8a/"; then echo "XATO: APK ichida arm64-v8a ham bor"; exit 1; fi

      - name: Remove testOnly flag and re-sign
        run: |
          BT=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1)
          AAPT2="$BT/aapt2"; ZIPALIGN="$BT/zipalign"; APKSIGNER="$BT/apksigner"
          APK=$(ls apk-out/*.apk | head -1)
          echo "APK: $APK"

          echo "--- testOnly OLDIN:"
          "$AAPT2" dump xmltree --file AndroidManifest.xml "$APK" | grep -i testOnly || echo "(testOnly qatori yo'q)"

          python3 - "$APK" /tmp/patched.apk <<'PY'
          import sys, struct, zipfile, re

          src, dst = sys.argv[1], sys.argv[2]
          TESTONLY = 0x01010272

          def patch_manifest(data):
              data = bytearray(data)
              pos = 8
              resmap = []
              found = 0
              patched = 0
              while pos + 8 <= len(data):
                  ctype, hsize, csize = struct.unpack_from('<HHI', data, pos)
                  if ctype == 0x0180:
                      n = (csize - hsize) // 4
                      resmap = list(struct.unpack_from('<%dI' % n, data, pos + hsize))
                  elif ctype == 0x0102:
                      ns, name, attr_start, attr_size, attr_count = struct.unpack_from('<IIHHH', data, pos + 16)
                      base = pos + 16 + attr_start
                      for i in range(attr_count):
                          off = base + i * attr_size
                          a_ns, a_name, a_raw, t_size, t_res0, t_type, t_data = struct.unpack_from('<IIIHBBI', data, off)
                          if a_name < len(resmap) and resmap[a_name] == TESTONLY:
                              found += 1
                              if t_data != 0:
                                  struct.pack_into('<I', data, off + 16, 0)
                                  patched += 1
                  if csize == 0:
                      break
                  pos += csize
              return bytes(data), found, patched

          sig = re.compile(r'^META-INF/([^/]+\.(SF|RSA|DSA|EC)|MANIFEST\.MF)$', re.I)
          zin = zipfile.ZipFile(src)
          zout = zipfile.ZipFile(dst, 'w')
          done = False
          for item in zin.infolist():
              if sig.match(item.filename):
                  continue
              data = zin.read(item.filename)
              if item.filename == 'AndroidManifest.xml':
                  data, found, patched = patch_manifest(data)
                  print('testOnly atributlari topildi: %d, o\'zgartirildi: %d' % (found, patched))
                  if found == 0:
                      print("XATO: testOnly atributi manifestda topilmadi")
                      sys.exit(3)
                  done = True
              zi = zipfile.ZipInfo(item.filename, date_time=item.date_time)
              zi.compress_type = item.compress_type
              zi.external_attr = item.external_attr
              zout.writestr(zi, data)
          zout.close()
          if not done:
              print("XATO: AndroidManifest.xml topilmadi")
              sys.exit(4)
          PY

          "$ZIPALIGN" -f -p 4 /tmp/patched.apk /tmp/aligned.apk

          keytool -genkeypair -keystore /tmp/debug.keystore \
            -storepass android -keypass android \
            -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

          "$APKSIGNER" sign --ks /tmp/debug.keystore --ks-pass pass:android \
            --key-pass pass:android --ks-key-alias androiddebugkey /tmp/aligned.apk

          "$APKSIGNER" verify --verbose /tmp/aligned.apk

          echo "--- testOnly KEYIN:"
          "$AAPT2" dump xmltree --file AndroidManifest.xml /tmp/aligned.apk | grep -i testOnly || true
          if "$AAPT2" dump xmltree --file AndroidManifest.xml /tmp/aligned.apk | grep -i testOnly | grep -i -E "true|0xffffffff"; then
            echo "XATO: testOnly hali ham true"
            exit 1
          fi

          cp -v /tmp/aligned.apk "$APK"

      - name: Show APK info (minSdk)
        run: |
          AAPT2=$(find $ANDROID_HOME/build-tools -name aapt2 | sort -V | tail -1)
          for APK in apk-out/*.apk; do
            echo "=== $APK"
            "$AAPT2" dump badging "$APK" | grep -E "^package:|minSdkVersion|targetSdkVersion|native-code"
            SDK=$("$AAPT2" dump badging "$APK" | grep -o "^minSdkVersion:'[0-9]*'" | grep -o "[0-9]*" || true)
            if [ -z "$SDK" ]; then
              echo "OGOHLANTIRISH: minSdk o'qilmadi"
            elif [ "$SDK" -gt 27 ]; then
              echo "XATO: minSdk=$SDK, Android 8.1 (SDK 27) da o'rnatilmaydi"
              exit 1
            else
              echo "OK: minSdk=$SDK"
            fi
          done

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: StealthGram-armeabi-v7a-APK
          path: apk-out/*.apk
          if-no-files-found: error
