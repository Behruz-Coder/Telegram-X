name: Build StealthGram (Telegram X) APK - 32 bit

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository with submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1
          lfs: true

      - name: Fetch LFS objects in submodules
        run: git submodule foreach --recursive 'git lfs pull || true'

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '25'

      - name: Setup Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Install Rust toolchain
        run: |
          RUST_VERSION=$(grep 'version.rust' version.properties | cut -d'=' -f2 | tr -d ' \r\n')
          if [ -z "$RUST_VERSION" ]; then RUST_VERSION="1.99.1"; fi
          echo "Installing Rust version: $RUST_VERSION"
          rustup toolchain install "$RUST_VERSION" --profile minimal --target aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android
          echo "RUST_HOME=$(rustup show home)" >> $GITHUB_ENV

      - name: Install Android SDK & NDK components
        run: |
          CMAKE_VER=$(grep 'version.cmake' version.properties | cut -d'=' -f2 | tr -d ' \r\n')
          if [ -z "$CMAKE_VER" ]; then CMAKE_VER="3.22.1"; fi
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install \
            "cmake;$CMAKE_VER" \
            "platforms;android-35" \
            "build-tools;35.0.0" || true

      - name: Configure local.properties
        run: |
          RUST_DIR=$(rustup show home)
          cat <<EOF > local.properties
          sdk.dir=$ANDROID_HOME
          rust.dir=$RUST_DIR
          app.id=org.stealthgram.messenger
          app.name=StealthGram
          telegram.api_id=25951885
          telegram.api_hash=389ff40efae9b1ad3e0b79d4ec864484
          app.disable_signing=true
          app.experimental=true
          tgx.extension=none
          app.download_url=https://telegram.org/dlx
          EOF

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build APK (armeabi-v7a, marshmallow)
        run: |
          touch /tmp/marker_v7a
          ./gradlew assembleMarshmallowDebug -Pandroid.injected.build.abi=armeabi-v7a -Dorg.gradle.jvmargs="-Xmx6g -XX:MaxMetaspaceSize=1g" --stacktrace

      - name: Collect and verify APK
        run: |
          mkdir -p apk-out
          find . -name "*.apk" -newer /tmp/marker_v7a -not -path "./apk-out/*" -exec cp -v {} apk-out/ \;
          ls -la apk-out
          APK=$(ls apk-out/*.apk | head -1)
          unzip -l "$APK" | grep -q "lib/armeabi-v7a/" || { echo "XATO: APK ichida armeabi-v7a kutubxonalari yo'q"; exit 1; }
          if unzip -l "$APK" | grep -q "lib/arm64-v8a/"; then echo "XATO: APK ichida arm64-v8a ham bor"; exit 1; fi

      - name: Show APK info (minSdk)
        run: |
          AAPT2=$(find $ANDROID_HOME/build-tools -name aapt2 | sort -V | tail -1)
          for APK in apk-out/*.apk; do
            echo "=== $APK"
            "$AAPT2" dump badging "$APK" | grep -E "^package:|minSdkVersion|targetSdkVersion|native-code"
            SDK=$("$AAPT2" dump badging "$APK" | grep -o "^minSdkVersion:'[0-9]*'" | grep -o "[0-9]*" || true)
            if [ -z "$SDK" ]; then
              echo "OGOHLANTIRISH: minSdk o'qilmadi, tekshirib bo'lmadi"
            elif [ "$SDK" -gt 27 ]; then
              echo "XATO: minSdk=$SDK, Android 8.1 (SDK 27) da o'rnatilmaydi"
              exit 1
            else
              echo "OK: minSdk=$SDK"
            fi
          done

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: StealthGram-armeabi-v7a-APK
          path: apk-out/*.apk
          if-no-files-found: error
